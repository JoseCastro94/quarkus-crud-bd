quarkus.datasource.db-kind=mssql
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:sqlserver://localhost:1433;databaseName=BD_empleado;encrypt=true;trustServerCertificate=true}
quarkus.datasource.username=${DB_USERNAME:sa}
quarkus.datasource.password=${DB_PASSWORD:castro}

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.smallrye-openapi.info-title=API de Empleados
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST para administrar empleados.
quarkus.swagger-ui.always-include=true

